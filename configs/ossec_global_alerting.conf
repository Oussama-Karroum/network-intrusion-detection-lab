<!--
  Relevant excerpt from /var/ossec/etc/ossec.conf (Wazuh Manager, Ubuntu host).
  Transcribed from the project report (Chapter 2, email alerting configuration,
  and Chapter 6, Suricata log ingestion). This is a PARTIAL file: only the
  blocks actually documented in the report are reproduced here. Merge into
  the real ossec.conf on a fresh Wazuh install; do not deploy this snippet
  standalone.
-->

<ossec_config>

  <!-- Email alerting via local Postfix relay (wazuh-maild) -->
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <email_notification>yes</email_notification>
    <smtp_server>localhost</smtp_server>
    <email_from>wazuh@wazuh-soc</email_from>
    <email_to>soc-admin@localhost</email_to>
    <email_maxperhour>5</email_maxperhour>
    <email_log_source>alerts.log</email_log_source>
    <agents_disconnection_time>15m</agents_disconnection_time>
    <agents_disconnection_alert_time>0</agents_disconnection_alert_time>
    <update_check>yes</update_check>
  </global>

  <alerts>
    <log_alert_level>3</log_alert_level>
    <email_alert_level>12</email_alert_level>
  </alerts>

  <!-- Suricata eve.json ingestion for network-based IDS alerts (Chapter 6) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <localfile>
    <log_format>json</log_format>
    <location>/var/log/suricata/eve.json</location>
  </localfile>

</ossec_config>
